# Builds the documentation site (docfx.json: the guides in docs/ plus the API reference generated from Savepoint.Core's doc
# comments) and publishes it to the git-pages server on every push to main that changes its sources, so a guide change shows
# without waiting for a release. Not on release tags: a tag points at a commit already on main, which published it. Pull requests that touch the sources only build it, with warnings as
# errors, so a broken link or a guide missing from docs/toc.yml fails before it merges.
#
# Publishing needs the repository variable DOCS_SITE_URL, the root of a git-pages host shared by several projects (such as
# https://docs.example.org/); this project's site is <root>/DOCS_PATH/, a site of its own. The server's wildcard setting maps
# each such path to the forge repository of the same name and lets the job's own token publish it, so no secret is stored.
# Without the variable the job builds the site and says it was not published.
name: Docs

on:
  push:
    branches: [main]
    paths: ['docfx.json', 'docfx/**', 'docs/**', 'src/Savepoint.Core/**', 'Directory.Build.props']
  pull_request:
    paths: ['docfx.json', 'docfx/**', 'docs/**', 'src/Savepoint.Core/**', 'Directory.Build.props', 'build/docs-footer.sh', '.config/dotnet-tools.json', '.forgejo/workflows/docs.yml']
  workflow_dispatch:

env:
  # The site's path on the host, which the server matches to this repository's name. Empty would aim at the host's index.
  DOCS_PATH: SavePoint

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The footer names the commit being built and takes its date, which the one commit of a shallow checkout holds.
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1

      # Forgejo has no setup-dotnet mirror. global.json rolls forward to the newest feature band, so the newest 10.0 SDK fits.
      - name: Install the .NET SDK
        run: |
          bash build/install-dotnet.sh /opt/dotnet
          echo "/opt/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=/opt/dotnet" >> "$GITHUB_ENV"

      # The footer (version, build commit and time, copyright, license) replaces the fallback in docfx.json. It holds quotes and HTML, so
      # it travels in a variable and reaches docfx as one quoted argument.
      - name: Build the site
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet tool restore
          footer="$(bash build/docs-footer.sh . "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY")"
          dotnet docfx docfx.json --warningsAsErrors --metadata "_appFooter=$footer"

      - name: Say whether the site will be published
        id: target
        env:
          SITE: ${{ vars.DOCS_SITE_URL }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$DOCS_PATH" ]; then
            echo "DOCS_PATH is empty, which would aim at the host's index instead of this project's site."; exit 1
          fi
          if [ "$PUBLISH" != true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "A pull request only builds the site."
          elif [ -z "$SITE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "DOCS_SITE_URL is not set, so the site was built but not published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "url=${SITE%/}/$DOCS_PATH/" >> "$GITHUB_OUTPUT"
            echo "Publishing to ${SITE%/}/$DOCS_PATH/."
          fi

      # A project site of its own under the host, so the host's index and the other projects are never touched.
      - name: Publish
        if: steps.target.outputs.publish == 'true'
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ steps.target.outputs.url }}
          token: ${{ forgejo.token }}
          source: artifacts/docs-site/
