# Runs the Linux and Windows gates (build with warnings as errors, every test, skip check, format check) on pull requests,
# and by hand from the Actions page. Not on pushes to main: main is protected and takes fast-forward merges only, so the
# commit that lands is the one its pull request already passed, and running it again only loads the shared runners.
# The Windows job runs on a self-hosted Windows VM in host mode, as a standard (non-admin) account.
name: Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # A change that touches only documentation (docs/, the documentation site's docfx.json and docfx/, and Markdown files at the
      # root) or agent instructions (.agents/, .claude/rules/, .han/) cannot change a build or a test, so the job passes without them;
      # docs.yml builds the site for such a change. The notices file is shipped with the app and read by tests, so it always takes the full gate.
      - name: Decide whether the change needs the gate
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; echo "No base to compare with: running the gate."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          code=$(printf '%s\n' "$changed" | grep -v -E '^(docs/.*|docfx/.*|docfx\.json|[^/]+\.md|\.agents/.*|\.claude/rules/.*|\.han/.*)$' | grep -v '^$' || true)
          needed=true
          if [ -z "$code" ] && ! printf '%s\n' "$changed" | grep -q -x 'THIRD-PARTY-NOTICES.md'; then
            needed=false
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          [ "$needed" = false ] && echo "Only documentation or agent instructions changed: the gate is not needed." || echo "Code changed: running the gate."

      # Forgejo has no setup-dotnet mirror. global.json rolls forward to the newest feature band, so the newest 10.0 SDK fits.
      - name: Install the .NET SDK
        if: steps.scope.outputs.needed == 'true'
        run: bash build/install-dotnet.sh /opt/dotnet

      # Tests drive the PowerShell scripts of build/, and the PowerShell the job image lacks installs as a .NET tool. Root installs
      # it, so the folders are opened to the gate user below.
      - name: Install PowerShell
        if: steps.scope.outputs.needed == 'true'
        run: |
          /opt/dotnet/dotnet tool install --tool-path /opt/pwsh PowerShell --version 7.6.8
          chmod -R a+rX /opt/pwsh /opt/dotnet

      # gpg checks the signatures in the source-archive script tests; dbus-daemon gives the notification tests a private session bus.
      - name: Install the tools the tests drive
        if: steps.scope.outputs.needed == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dbus gnupg

      # The job container runs as root, and root ignores file permissions, so the tests of unreadable and undeletable files
      # would skip. An ordinary user runs them for real.
      - name: Make an ordinary user
        if: steps.scope.outputs.needed == 'true'
        run: |
          useradd --create-home gate
          chown -R gate:gate "$GITHUB_WORKSPACE"

      - name: Gate
        if: steps.scope.outputs.needed == 'true'
        run: >-
          runuser -u gate --
          env HOME=/home/gate PATH="/opt/pwsh:/opt/dotnet:$PATH" DOTNET_ROOT=/opt/dotnet POWERSHELL_TELEMETRY_OPTOUT=1
          DOTNET_CLI_USE_MSBUILD_SERVER=0 MSBUILDDISABLENODEREUSE=1
          bash build/gate.sh

  windows:
    runs-on: windows
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # The runner may keep each job's folder; the VM's disk is small, so earlier jobs' folders go (the runner runs one job at
      # a time). The tool cache stays so the SDK is not downloaded again.
      - name: Remove earlier jobs' folders
        run: |
          $work = Split-Path -Parent (Split-Path -Parent $env:GITHUB_WORKSPACE)
          $current = Split-Path -Leaf (Split-Path -Parent $env:GITHUB_WORKSPACE)
          # Job folders have 16-character names; the short ones hold downloaded actions, which are small and reused.
          Get-ChildItem -Directory $work | Where-Object { $_.Name -match '^[0-9a-f]{16}$' -and $_.Name -ne $current } | ForEach-Object {
            "removing $($_.Name)"
            Remove-Item -Recurse -Force -ErrorAction Continue $_.FullName
          }

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # Same rule as the Linux job.
      - name: Decide whether the change needs the gate
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $needed = 'true'
          $hasBase = $false
          if ($env:BASE) {
            git cat-file -e "$($env:BASE)^{commit}" 2>$null
            $hasBase = $LASTEXITCODE -eq 0
          }
          if ($hasBase) {
            $changed = @(git diff --name-only $env:BASE HEAD)
            $changed
            $code = @($changed | Where-Object { $_ -and $_ -notmatch '^(docs/.*|docfx/.*|docfx\.json|[^/]+\.md|\.agents/.*|\.claude/rules/.*|\.han/.*)$' })
            if ($code.Count -eq 0 -and $changed -notcontains 'THIRD-PARTY-NOTICES.md') { $needed = 'false' }
          } else {
            'No base to compare with: running the gate.'
          }
          "needed=$needed" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if ($needed -eq 'false') { 'Only documentation or agent instructions changed: the gate is not needed.' } else { 'Code changed: running the gate.' }

      # Kept between runs in the runner's own folder; the script only downloads when the newest 10.0 SDK is missing.
      - name: Install the .NET SDK
        if: steps.scope.outputs.needed == 'true'
        run: |
          $dotnet = Join-Path ($env:RUNNER_TOOL_CACHE ?? $env:USERPROFILE) 'dotnet'
          ./build/install-dotnet.ps1 -InstallDir $dotnet
          "DOTNET_ROOT=$dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $dotnet | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Gate
        if: steps.scope.outputs.needed == 'true'
        env:
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          # The runner has no gpg of its own, and the test of the source-archive signatures needs one: Git for Windows ships it. It goes
          # last on the path so its Unix tools do not shadow the Windows ones.
          $env:PATH = $env:PATH + ';' + (Join-Path $env:ProgramFiles 'Git\usr\bin')
          ./build/gate.ps1
